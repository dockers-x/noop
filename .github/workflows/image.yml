name: Build and push image

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when upstream has not changed
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: noop-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v5

      - name: Compare upstream main with the last build
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          git ls-remote https://github.com/huacnlee/noop.git refs/heads/main > upstream-head
          sha=$(cut -f1 upstream-head)
          have_sha=$(node -p "require('./upstream.json').sha || ''")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$have_sha" ] || [ "$FORCE_BUILD" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            # 上游版本号来自 app/nsh.json 的 version（如 1.0.7），镜像 tag 跟随；上游未 bump 时用日期兜底
            upstream_ver=$(gh api repos/huacnlee/noop/contents/app/nsh.json --jq '.content' | base64 -d | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if [ "$upstream_ver" != "$(node -p "require('./upstream.json').version || ''")" ]; then
              echo "version=$upstream_ver" >> "$GITHUB_OUTPUT"
            else
              echo "version=${upstream_ver}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out locked upstream source
        if: steps.state.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          repository: huacnlee/noop
          ref: ${{ steps.state.outputs.sha }}
          path: upstream

      - name: Set up QEMU
        if: steps.state.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.state.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.state.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        if: steps.state.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/huacnlee/noop
            org.opencontainers.image.revision=${{ steps.state.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/noop:${{ steps.state.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/noop:latest
          cache-from: type=gha,scope=noop
          cache-to: type=gha,mode=max,scope=noop

      - name: Make the GHCR package public
        if: steps.state.outputs.build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/noop" -f visibility=public || true

      - name: Record the built upstream commit
        if: steps.state.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.state.outputs.sha }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          content=$(printf '{\n  "sha": "%s",\n  "version": "%s"\n}\n' "$UPSTREAM_SHA" "$VERSION" | base64 -w0)
          file_sha=$(gh api "repos/${{ github.repository }}/contents/upstream.json" --jq .sha)
          short=$(printf '%s' "$UPSTREAM_SHA" | cut -c1-7)
          gh api -X PUT "repos/${{ github.repository }}/contents/upstream.json" \
            -f message="chore: record build $VERSION (upstream $short)" \
            -f content="$content" -f sha="$file_sha" -f branch=main >/dev/null
          echo "built ghcr.io/${{ github.repository_owner }}/noop:$VERSION and latest from $short"
